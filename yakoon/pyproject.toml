[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yakoon"
version = "0.0.1"
description = "Yakoon Platform Manager — install, manage, and run Yakoon distributions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Stefan Bergmann" }]

[project.scripts]
yak = "yakoon.cli:main"
