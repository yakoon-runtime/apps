name: crm
kind: meta
extends: desktop
dependencies:
  - y5n-packs-ident
  - y5n-packs-crm
workspace:
  path: structure
  packs: [root, boot, system, ident, crm]
  mounts:
    - source: packs/y5n-packs-ident/structure
      target: /usr/sbin/ident
    - source: packs/y5n-packs-crm/structure
      target: /opt/crm
