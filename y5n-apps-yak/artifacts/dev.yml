name: dev
kind: development
dependencies:
  - y5n-sdk-python
  - y5n-runtime-api
  - y5n-runtime-store
  - y5n-runtime-transport
  - y5n-runtime-llm
  - y5n-runtime-engine
  - y5n-runtime-boot
  - y5n-apps-runtime
  - y5n-apps-shell
  - y5n-apps-web
  - y5n-packs-root
  - y5n-packs-system
workspace:
  path: workspace/structure
  packs: [root, boot, system]
  mounts:
    - source: packs/y5n-packs-root/structure
      target: /
    - source: runtime/y5n-runtime-boot/structure
      target: /boot
    - source: packs/y5n-packs-system/structure
      target: /usr/bin
