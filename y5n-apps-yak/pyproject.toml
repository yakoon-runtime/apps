[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "y5n-apps-yak"
version = "0.1.0"
description = "Yakoon Platform Manager — install, manage, run Yakoon distributions"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Stefan Bergmann" }]
dependencies = ["rich>=13.0", "PyYAML>=6.0"]

[project.scripts]
yak = "y5n.apps.yak.hosts.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
