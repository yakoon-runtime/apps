[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "y5n-apps-yak"
version = "0.2.0"
description = "Yakoon Platform Manager — install, manage, run Yakoon distributions"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Stefan Bergmann" }]
dependencies = ["rich>=13.0", "PyYAML>=6.0", "packaging>=23"]

[project.scripts]
yak = "y5n.apps.yak.hosts.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"y5n.apps.yak" = ["sources.toml"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: full install/materialize cycle (venv + pip); skip by default; run with -m slow",
]
