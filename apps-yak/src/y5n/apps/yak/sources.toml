    "github:yakoon-runtime/caps-system",
    "github:yakoon-runtime/caps-ident",
    "github:yakoon-runtime/caps-contacts",
    "github:yakoon-runtime/caps-worlds",
    "github:yakoon-runtime/caps-labs",
    "github:yakoon-runtime/runtime",
    "github:yakoon-runtime/sdk",
    "github:yakoon-runtime/apps",
